const PROFILE_KEY = p => JSON.stringify([p.days,p.equipment,p.experience]);
let planMessage='';
const option=(value,label,current)=>`<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(label)}</option>`;

 const p=db.profile||{};
 $('profile').innerHTML=`<div class="card"><h2>${db.profile?'個人資料':'先認識你，再安排訓練'}</h2><p class="muted">設定會保存在這台裝置。之後可以回到「個人」修改，不需要登入。</p><form onsubmit="saveProfile(event)">

 <p class="muted">修改天數、器材或經驗會重新產生示範菜單，上一份會保留在備份資料內。進行中的訓練與既有紀錄會保留。</p><button>${db.profile?'儲存個人資料':'建立我的訓練菜單'}</button></form></div>`;
}
function saveProfile(e){
 e.preventDefault();const p=formData(e);p.days=Number(p.days);p.notes=p.notes.trim();
 if(![2,3,4].includes(p.days)||!['gym','dumbbell','bodyweight'].includes(p.equipment)||!['beginner','intermediate','experienced'].includes(p.experience)||!['both','muscle','fat'].includes(p.goal))return;
 if(!db.guidedPlan||db.guidedPlan.profileKey!==PROFILE_KEY(p)){if(db.guidedPlan)db.previousGuidedPlan=db.guidedPlan;db.guidedPlan=buildGuidedPlan(p)}

function buildGuidedPlan(p){
 const catalog={
 gym:{squat:['腿推機','器械標示'],push:['坐姿胸推機','器械標示'],pull:['滑輪下拉','器械標示'],row:['坐姿划船','器械標示'],hinge:['臀推機','器械標示'],curl:['腿彎舉機','器械標示'],shoulder:['肩推機','器械標示'],fly:['蝴蝶式夾胸','器械標示'],arm:['二頭彎舉機','器械標示']},

 return {profileKey:PROFILE_KEY(p),days:layouts.map(([title,keys])=>({title,items:keys.map(key=>({exercise:catalog[key][0],basis:catalog[key][1],sets:p.experience==='beginner'?2:3,min:8,max:12,rest:120,weight:catalog[key][1]==='徒手'?0:''}))}))};

function lastExercise(exercise){return db.workout.filter(x=>x.exercise===exercise&&x.date<=date()&&Number.isFinite(Number(x.weight))).at(-1)}

 if(!db.profile||!db.guidedPlan)return `<div class="card"><h2>建立引導式菜單</h2><p>先設定每週天數、器材與經驗，產生包含動作、組數及次數的示範菜單。</p><button onclick="tab('profile')">填寫個人資料</button></div>${legacy}`;
 const p=db.profile,plan=db.guidedPlan;
 return `<div class="card"><h2>我的訓練安排</h2><p class="accent" role="status">${esc(planMessage)}</p><p>每週 ${p.days} 天 · ${esc({gym:'健身房',dumbbell:'啞鈴',bodyweight:'徒手'}[p.equipment])} · ${esc({both:'增肌＋減脂',muscle:'增肌',fat:'減脂'}[p.goal])}</p><p class="muted">${p.days===4?'上肢／下肢交替，依恢復情況安排休息日。':'兩堂全身訓練之間安排休息日，按 A → B'+(p.days===3?' → C':'')+' 順序循環。'} 目標僅作紀錄，不會自動推算減脂熱量或加重。</p>${p.notes?`<p class="notice">你的限制：${esc(p.notes)}<br>下方是一般示範菜單，尚未依這段備註排除動作；請先編輯不適合的項目。</p>`:''}<p class="muted">每組保留約 2–3 次餘力，動作品質優先。熱身組另計；不同器材與重量記法不能直接比較。無歷史資料時重量不會預填。</p><button class="secondary" onclick="tab('profile')">修改個人設定</button><p><small>一般訓練參考：<a href="https://pubmed.ncbi.nlm.nih.gov/19204579/" target="_blank" rel="noopener">ACSM 阻力訓練指引</a>。此處為可調整的示範安排。</small></p></div>
 ${db.activeSession?'<div class="card"><p>目前有一堂進行中的訓練。</p><button onclick="tab(\'workout\')">繼續訓練</button></div>':''}
 ${plan.days.map((day,d)=>`<div class="card"><h2>第 ${d+1} 天 · ${esc(day.title)}</h2>${day.items.map((x,i)=>`<div class="plan-move"><b>${i+1}. ${esc(x.exercise)}</b><p class="accent">${x.sets} 組 × ${x.min}–${x.max} 次 · 休息 ${x.rest} 秒</p><p>重量：${proposedWeight(x)===''?'待設定':esc(proposedWeight(x))+' kg'} · ${esc(x.basis)}</p><small>${weightNote(x)}</small><details><summary>調整動作／組數／重量</summary><form onsubmit="updatePlanMove(event,${d},${i})"><label>動作名稱<input name="exercise" maxlength="60" value="${esc(x.exercise)}" required></label><div class="grid"><label>組數<input name="sets" type="number" min="1" max="10" value="${x.sets}" required></label><label>休息秒數<input name="rest" type="number" min="15" max="600" step="15" value="${x.rest}" required></label><label>最少次數<input name="min" type="number" min="1" max="100" value="${x.min}" required></label><label>最多次數<input name="max" type="number" min="1" max="100" value="${x.max}" required></label></div><label>本次預設重量 kg（可留白）<input name="weight" type="number" min="0" max="1000" step="0.5" value="${esc(x.weight)}"></label><label>重量記法<select name="basis">${['器械標示','槓鈴總重','啞鈴單手','啞鈴單顆','徒手'].map(v=>option(v,v,x.basis)).join('')}</select></label><button>儲存調整</button></form></details></div>`).join('')}<p><button onclick="startPlanDay(${d})" ${db.activeSession?'disabled':''}>開始這堂訓練 →</button></p></div>`).join('')}${legacy}`;
}
function updatePlanMove(e,d,i){e.preventDefault();const v=formData(e);v.exercise=v.exercise.trim();if(!v.exercise)return;for(const k of ['sets','min','max','rest'])v[k]=Number(v[k]);if(v.min>v.max){e.target.elements.max.setCustomValidity('最多次數不能小於最少次數');e.target.elements.max.reportValidity();e.target.elements.max.oninput=()=>e.target.elements.max.setCustomValidity('');return}v.weight=v.weight===''?'':Number(v.weight);db.guidedPlan.days[d].items[i]=v;save();planMessage='動作設定已更新。';render()}
function startPlanDay(d){if(db.activeSession){tab('workout');return}const day=db.guidedPlan.days[d];db.activeSession={id:crypto.randomUUID(),date:date(),title:day.title,items:JSON.parse(JSON.stringify(day.items))};save();tab('workout')}
function sessionRecords(i){const s=db.activeSession;return s?db.workout.filter(x=>x.sessionId===s.id&&x.planIndex===i):[]}
function renderSession(){
 const s=db.activeSession;if(!s)return '';
 const total=s.items.reduce((a,x)=>a+x.sets,0),done=s.items.reduce((a,x,i)=>a+sessionRecords(i).length,0);
 return `<div class="card"><h2>進行中 · ${esc(s.title)}</h2><p>${esc(s.date)} · 已完成 ${done} / ${total} 組</p><p class="muted">每組完成後，輸入實際重量與次數再儲存；不會預先寫入未完成的組數。</p>${db.profile?.notes?`<p class="notice">動作限制：${esc(db.profile.notes)}</p>`:''}${s.items.map((x,i)=>{const records=sessionRecords(i),complete=records.length>=x.sets,last=records.at(-1);return `<div class="plan-move"><h3>${esc(x.exercise)}</h3><p>${x.sets} 組 × ${x.min}–${x.max} 次 · 休息 ${x.rest} 秒</p><small>${weightNote(x)}</small><p class="accent">${complete?'✓ 完成':`第 ${records.length+1} / ${x.sets} 組`} · ${esc(x.basis)}</p>${complete?'':`<form onsubmit="logPlanSet(event,${i})"><div class="grid"><label>實際重量 kg<input name="weight" type="number" min="0" max="1000" step="0.5" value="${esc(last?last.weight:proposedWeight(x))}" placeholder="試做後設定" required></label><label>實際次數<input name="reps" type="number" min="1" max="1000" value="${last?last.reps:x.min}" required></label></div><p><button>完成並儲存這組</button></p></form>`}${records.map((r,n)=>`<small>✓ 第 ${n+1} 組：${r.weight} kg × ${r.reps} 次</small><br>`).join('')}</div>`}).join('')}<p><button class="secondary" onclick="endPlanSession()">${done>=total?'完成這堂訓練':'結束訓練，保留已記錄組數'}</button></p></div>`;
}
function logPlanSet(e,i){e.preventDefault();const s=db.activeSession;if(!s||sessionRecords(i).length>=s.items[i].sets)return;const v=formData(e),weight=Number(v.weight),reps=Number(v.reps);if(v.weight===''||!Number.isFinite(weight)||weight<0||weight>1000||!Number.isInteger(reps)||reps<1||reps>1000)return;db.workout.push({date:s.date,exercise:s.items[i].exercise,weight,reps,basis:s.items[i].basis,sessionId:s.id,planIndex:i});db.workout.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function endPlanSession(){delete db.activeSession;save();planMessage='訓練已結束，實際完成的組數已保留。';tab('plan')}

function draw(){let c=$('chart'),ctx=c.getContext('2d'),arr=db.body;if(!arr.length){ctx.fillStyle='#9eacc3';ctx.font='24px sans-serif';ctx.fillText('新增體重後顯示走勢',95,130);return}let vals=arr.map(x=>num(x.weight)),lo=Math.min(...vals)-2,hi=Math.max(...vals)+2;ctx.strokeStyle='#334760';ctx.beginPath();ctx.moveTo(40,20);ctx.lineTo(40,225);ctx.lineTo(580,225);ctx.stroke();ctx.strokeStyle='#61e9d1';ctx.lineWidth=4;ctx.beginPath();arr.forEach((x,i)=>{let px=50+(arr.length===1?0:i/(arr.length-1)*515),py=210-(num(x.weight)-lo)/(hi-lo)*180;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#aebed3';ctx.font='20px sans-serif';ctx.fillText(`${Math.min(...vals)}–${Math.max(...vals)} kg`,55,35)}render();if(!db.profile)tab('profile');
</script></html>
