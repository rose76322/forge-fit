<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>FORGE FIT</title><style>body{margin:0;background:#0b1020;color:#eef5ff;font:16px -apple-system,sans-serif}main{max-width:650px;margin:auto;padding:22px 16px 95px}h1{font-size:28px}h2{font-size:19px}.accent{color:#61e9d1}.muted,small{color:#9eacc3}.card{background:#172135;border:1px solid #2b3a52;border-radius:18px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:#172135;border-radius:12px;padding:13px 8px}.stats b{display:block;color:#61e9d1;font-size:23px}.stats small{font-size:11px}label{display:block;font-size:13px;color:#b5c3d7;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:12px;background:#0b1324;color:white;border:1px solid #3b4b62;border-radius:10px;font-size:16px}button{border:0;background:#61e9d1;color:#0b1720;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{background:#34435a;color:white}.danger{background:#58303e;color:#ffc8d1}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #334055;padding:12px 0}.item:last-child{border:0}.item small{display:block;margin-top:4px}.item button{padding:8px}.bar{background:#304058;border-radius:8px;height:9px;overflow:hidden;margin:9px 0 16px}.bar i{display:block;background:#61e9d1;height:100%}nav{position:fixed;bottom:0;left:0;right:0;background:#111a2af5;display:flex;justify-content:center;padding:8px 0 15px}nav button{flex:1;max-width:130px;background:transparent;color:#aab9d0;font-size:12px;padding:8px 2px}nav button.active{background:#263d49;color:#61e9d1}section{display:none}section.active{display:block}canvas{width:100%;height:170px}p{line-height:1.55}/* iPhone Safari: constrain native date controls to the card width. */input{min-width:0;max-width:100%}.grid>div{min-width:0}input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none}input[type="date"]::-webkit-date-and-time-value{min-width:0;text-align:left}</style><main><small class="accent">FORGE FIT / FREE</small><h1>鍛造你的更強版本 ⚡</h1><p class="muted">增肌 × 減脂｜私人健身控制台</p><section id="home" class="active"></section><section id="workout"></section><section id="food"></section><section id="body"></section><section id="plan"></section></main><nav id="nav"><button class="active" onclick="tab('home')">⌂<br>總覽</button><button onclick="tab('workout')">🏋<br>訓練</button><button onclick="tab('food')">🥗<br>飲食</button><button onclick="tab('body')">📈<br>身體</button><button onclick="tab('plan')">☷<br>菜單</button></nav><script>
const KEY='forgefit_data_v1',date=()=>new Date().toLocaleDateString('en-CA'),$=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),num=x=>Number(x)||0;const initial={workout:[],food:[],body:[],goals:{cal:2200,protein:140},plan:[['週一','推：胸肩三頭','臥推、肩推、三頭下壓'],['週二','拉：背與二頭','下拉、划船、二頭彎舉'],['週三','恢復日','快走30分鐘'],['週四','腿與核心','深蹲、腿推、棒式'],['週五','全身訓練','硬舉、啞鈴推、划船'],['週六','輕有氧','單車或快走30分鐘'],['週日','休息','睡眠與恢復']]};let db;try{db={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=initial}let current='home';function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('儲存失敗，請匯出備份')}}function tab(t){current=t;document.querySelectorAll('section').forEach(e=>e.classList.toggle('active',e.id===t));document.querySelectorAll('nav button').forEach((e,i)=>e.classList.toggle('active',['home','workout','food','body','plan'][i]===t));render();window.scrollTo(0,0)}function item(a,b,button=''){return `<div class="item"><div><b>${esc(a)}</b><small>${esc(b)}</small></div>${button}</div>`}function remove(k,i){if(confirm('確定刪除這筆紀錄？')){db[k].splice(i,1);save();render()}}function formData(e){return Object.fromEntries(new FormData(e.target))}function add(e,k){e.preventDefault();let v=formData(e);if(k==='workout'){v.weight=num(v.weight);v.reps=num(v.reps)}if(k==='food'){v.cal=num(v.cal);v.protein=num(v.protein)}if(k==='body'){v.weight=num(v.weight);v.fat=v.fat?num(v.fat):''}db[k].push(v);db[k].sort((a,b)=>a.date.localeCompare(b.date));save();render()}function goal(e){e.preventDefault();let v=formData(e);db.goals={cal:num(v.cal),protein:num(v.protein)};save();render()}function edit(i){let a=prompt('訓練主題',db.plan[i][1]);if(a===null)return;let b=prompt('訓練內容',db.plan[i][2]);if(b===null)return;db.plan[i][1]=a.slice(0,80);db.plan[i][2]=b.slice(0,200);save();render()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forge-fit-backup-'+date()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.workout)||!Array.isArray(d.food)||!Array.isArray(d.body)||!Array.isArray(d.plan)||!d.goals)throw Error();if(!confirm('匯入會覆蓋目前紀錄，確定嗎？'))return;db=d;save();render();alert('匯入成功')}catch{alert('備份檔格式不正確')}}function render(){let f=db.food.filter(x=>x.date===date()),w=db.workout.filter(x=>x.date===date()),cal=f.reduce((a,x)=>a+num(x.cal),0),pro=f.reduce((a,x)=>a+num(x.protein),0),latest=db.body.at(-1),bar=(v,g)=>`<div class="bar"><i style="width:${Math.min(100,Math.round(v/(g||1)*100))}%"></i></div>`;$('home').innerHTML=`<div class="stats"><div><b>${w.length}</b><small>今日訓練組</small></div><div><b>${Math.round(pro)}g</b><small>今日蛋白質</small></div><div><b>${latest?latest.weight:'—'}</b><small>最新體重 kg</small></div></div><div class="card"><h2>今日營養</h2>熱量 ${Math.round(cal)} / ${db.goals.cal} kcal ${bar(cal,db.goals.cal)}蛋白質 ${Math.round(pro)} / ${db.goals.protein} g ${bar(pro,db.goals.protein)}<button onclick="tab('food')">記錄飲食 →</button></div><div class="card"><h2>今日訓練</h2>${w.length?w.map(x=>item(x.exercise,`${x.weight}kg × ${x.reps}次`)).join(''):'<p class="muted">今天還沒有訓練紀錄</p>'}<button onclick="tab('workout')">開始訓練 →</button></div><div class="card"><h2>資料備份</h2><p class="muted">資料保存在目前瀏覽器。清除網站資料或更換手機可能遺失，請定期備份。</p><button onclick="backup()">匯出備份</button> <button class="secondary" onclick="$('import').click()">匯入備份</button><input style="display:none" type="file" id="import" accept="application/json" onchange="restore(event)"></div>`;
$('workout').innerHTML=`<div class="card"><h2>新增訓練組</h2><form onsubmit="add(event,'workout')"><label>日期</label><input type="date" name="date" value="${date()}" required><label>訓練動作</label><input name="exercise" list="moves" placeholder="例如：槓鈴臥推" maxlength="60" required><datalist id="moves"><option value="槓鈴臥推"><option value="深蹲"><option value="硬舉"><option value="滑輪下拉"><option value="坐姿划船"><option value="肩推"><option value="二頭彎舉"></datalist><div class="grid"><div><label>重量 kg</label><input type="number" name="weight" value="20" min="0" max="1000" step="0.5" required></div><div><label>次數</label><input type="number" name="reps" value="10" min="1" max="1000" required></div></div><p><button>＋ 儲存一組</button></p></form></div><div class="card"><h2>訓練歷史</h2>${db.workout.length?db.workout.map((x,i)=>item(x.exercise,`${x.date}｜${x.weight}kg × ${x.reps}次`,`<button class="danger" onclick="remove('workout',${i})">刪除</button>`)).reverse().join(''):'<p class="muted">尚無紀錄</p>'}</div>`;
$('food').innerHTML=`<div class="card"><h2>每日營養目標</h2><form onsubmit="goal(event)"><div class="grid"><div><label>熱量 kcal</label><input name="cal" type="number" min="500" max="10000" value="${db.goals.cal}" required></div><div><label>蛋白質 g</label><input name="protein" type="number" min="1" max="1000" value="${db.goals.protein}" required></div></div><p class="muted">預設值僅供示範，請依個人需求調整。</p><button>儲存目標</button></form></div><div class="card"><h2>新增飲食</h2><form onsubmit="add(event,'food')"><label>日期</label><input name="date" type="date" value="${date()}" required><label>食物名稱</label><input name="name" maxlength="80" placeholder="例如：雞胸肉便當" required><div class="grid"><div><label>熱量 kcal</label><input name="cal" type="number" min="0" max="10000" step="0.1" required></div><div><label>蛋白質 g</label><input name="protein" type="number" min="0" max="1000" step="0.1" required></div></div><p><button>＋ 新增食物</button></p></form></div><div class="card"><h2>飲食歷史</h2>${db.food.length?db.food.map((x,i)=>item(x.name,`${x.date}｜${x.cal}kcal｜蛋白質${x.protein}g`,`<button class="danger" onclick="remove('food',${i})">刪除</button>`)).reverse().join(''):'<p class="muted">尚無紀錄</p>'}</div>`;
$('body').innerHTML=`<div class="card"><h2>身體測量</h2><form onsubmit="add(event,'body')"><label>日期</label><input name="date" type="date" value="${date()}" required><div class="grid"><div><label>體重 kg</label><input name="weight" type="number" min="1" max="500" step="0.1" required></div><div><label>體脂 %（選填）</label><input name="fat" type="number" min="1" max="80" step="0.1"></div></div><p><button>＋ 儲存測量</button></p></form></div><div class="card"><h2>體重走勢</h2><canvas id="chart" width="600" height="260"></canvas></div><div class="card"><h2>測量歷史</h2>${db.body.length?db.body.map((x,i)=>item(`${x.weight} kg`,`${x.date}${x.fat?'｜體脂 '+x.fat+'%':''}`,`<button class="danger" onclick="remove('body',${i})">刪除</button>`)).reverse().join(''):'<p class="muted">尚無紀錄</p>'}</div>`;
$('plan').innerHTML=`<div class="card"><h2>每週訓練菜單</h2><p class="muted">可自由修改的增肌減脂示範菜單，請依個人恢復狀況調整。</p>${db.plan.map((x,i)=>item(`${x[0]}｜${x[1]}`,x[2],`<button class="secondary" onclick="edit(${i})">編輯</button>`)).join('')}</div>`;if(current==='body')draw()}
function draw(){let c=$('chart'),ctx=c.getContext('2d'),arr=db.body;if(!arr.length){ctx.fillStyle='#9eacc3';ctx.font='24px sans-serif';ctx.fillText('新增體重後顯示走勢',95,130);return}let vals=arr.map(x=>num(x.weight)),lo=Math.min(...vals)-2,hi=Math.max(...vals)+2;ctx.strokeStyle='#334760';ctx.beginPath();ctx.moveTo(40,20);ctx.lineTo(40,225);ctx.lineTo(580,225);ctx.stroke();ctx.strokeStyle='#61e9d1';ctx.lineWidth=4;ctx.beginPath();arr.forEach((x,i)=>{let px=50+(arr.length===1?0:i/(arr.length-1)*515),py=210-(num(x.weight)-lo)/(hi-lo)*180;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#aebed3';ctx.font='20px sans-serif';ctx.fillText(`${Math.min(...vals)}–${Math.max(...vals)} kg`,55,35)}render();
</script></html>
