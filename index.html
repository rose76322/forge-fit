{db.goals.protein||'未設定'} g ${Number(db.goals.protein)>0?bar(pro,db.goals.protein):'<p></p>'}<button onclick="tab('food')">記錄飲食 →</button></div><div class="card"><h2>今日訓練</h2>${w.length?w.map(x=>item(x.exercise,`${x.weight}kg × ${x.reps}次`)).join(''):'<p class="muted">今天還沒有訓練紀錄</p>'}<button onclick="tab('workout')">開始訓練 →</button></div><div class="card"><h2>資料備份</h2><p class="muted">資料保存在目前瀏覽器。清除網站資料或更換手機可能遺失，請定期備份。</p><button onclick="backup()">匯出備份</button> <button class="secondary" onclick="$('import').click()">匯入備份</button><input style="display:none" type="file" id="import" accept="application/json" onchange="restore(event)"></div>`;

const PROFILE_KEY = p => JSON.stringify([p.days,p.equipment,p.experience,...(p.split==='bodypart'?['bodypart']:[])]);
let planMessage='';
const option=(value,label,current)=>`<option value="${esc(value)}" ${String(value)===String(current)?'selected':''}>${esc(label)}</option>`;
function renderProfile(){
 const p=db.profile||{};
 $('profile').innerHTML=`<div class="card"><h2>${db.profile?'個人資料':'先認識你，再安排訓練'}</h2><p class="muted">設定會保存在這台裝置。之後可以回到「個人」修改，不需要登入。</p><form onsubmit="saveProfile(event)">

 <label for="profile-experience">重訓經驗</label><select id="profile-experience" name="experience" required><option value="" disabled ${!p.experience?'selected':''}>請選擇</option>${option('beginner','剛開始或未滿半年',p.experience)}${option('intermediate','半年到兩年',p.experience)}${option('experienced','兩年以上',p.experience)}</select>

 <p class="muted">修改天數、器材、經驗或分堂方式會重新產生菜單，上一份會保留在備份資料內。進行中的訓練與既有紀錄會保留。</p><button>${db.profile?'儲存個人資料':'建立我的訓練菜單'}</button> <button class="secondary" name="next" value="food">儲存並查看營養建議</button></form></div>`;
}
function saveProfile(e){
 e.preventDefault();const p=formData(e);p.days=Number(p.days);p.notes=p.notes.trim();if(!['bodypart','fullbody'].includes(p.split))p.split='fullbody';if(p.equipment!=='gym')p.split='fullbody';for(const field of ['nutAge','nutHeight','nutWeight'])p[field]=p[field]?Number(p[field]):'';
 if(![2,3,4].includes(p.days)||!['gym','dumbbell','bodyweight'].includes(p.equipment)||!['beginner','intermediate','experienced'].includes(p.experience)||!['both','muscle','fat'].includes(p.goal))return;
 if(!db.guidedPlan||db.guidedPlan.profileKey!==PROFILE_KEY(p)){if(db.guidedPlan)db.previousGuidedPlan=db.guidedPlan;db.guidedPlan=buildGuidedPlan(p)}
 db.profile=p;save();planMessage='個人設定已儲存。';nutritionMessage='個人資料已儲存，請確認下方估算。';tab(e.submitter?.value==='food'?'food':'plan');

function buildGuidedPlan(p){
 if(p.split==='bodypart'&&p.equipment==='gym')return buildBodyPartPlan(p);
 const catalog={
 gym:{squat:['腿推機','器械標示'],push:['坐姿胸推機','器械標示'],pull:['滑輪下拉','器械標示'],row:['坐姿划船','器械標示'],hinge:['臀推機','器械標示'],curl:['腿彎舉機','器械標示'],shoulder:['肩推機','器械標示'],fly:['蝴蝶式夾胸','器械標示'],arm:['二頭彎舉機','器械標示']},
 dumbbell:{squat:['高腳杯深蹲','啞鈴單顆'],push:['啞鈴地板臥推','啞鈴單手'],pull:['單手啞鈴划船','啞鈴單手'],row:['雙手啞鈴划船','啞鈴單手'],hinge:['啞鈴羅馬尼亞硬舉','啞鈴單手'],curl:['啞鈴臀橋','啞鈴單顆'],shoulder:['啞鈴肩推','啞鈴單手'],fly:['啞鈴側平舉','啞鈴單手'],arm:['啞鈴二頭彎舉','啞鈴單手']},

 }[p.equipment];
 const layouts=p.days===4?[

 ]:[['全身 A',['squat','push','pull','curl','arm']],['全身 B',['squat','push','row','hinge','shoulder']],...(p.days===3?[['全身 C',['squat','pull','push','hinge','fly']]]:[])];
 return {profileKey:PROFILE_KEY(p),days:layouts.map(([title,keys])=>({title,items:keys.map(key=>({exercise:catalog[key][0],basis:catalog[key][1],sets:p.experience==='beginner'?2:3,min:8,max:12,rest:120,weight:catalog[key][1]==='徒手'?0:''}))}))};
}

function renderGuidedPlan(){

function estimateNutrition(input){
 const x=input,missing=[];
 for(const [key,label] of [['age','年齡'],['height','身高'],['weight','體重'],['sex','公式係數'],['activity','活動量'],['status','適用狀況'],['goal','健身目標']])if(!x[key])missing.push(label);
 if(missing.length)return {ok:false,reason:'還需要填寫：'+missing.join('、')+'。'};
 if(![x.age,x.height,x.weight,x.activity].every(Number.isFinite))return {ok:false,reason:'請確認身體資料為有效數字。'};
 if(x.age<18||x.age>80||x.status!=='general')return {ok:false,reason:'這套一般成人公式不適用目前設定，請使用營養師或醫師提供的手動目標。'};
 if(!['male','female'].includes(x.sex)||![1.4,1.6,1.8,2].includes(x.activity)||!['both','muscle','fat'].includes(x.goal)||x.height<100||x.height>230||x.weight<30||x.weight>300)return {ok:false,reason:'資料超出目前公式設定範圍，請確認輸入或使用專業提供的手動目標。'};
 const bmi=x.weight/((x.height/100)**2);
 if(bmi<18.5&&x.goal==='fat')return {ok:false,reason:'目前體重相對身高偏低，不自動產生減脂熱量目標，請先與專業人員確認。'};
 const resting=10*x.weight+6.25*x.height-5*x.age+(x.sex==='male'?5:-161),maintenance=resting*x.activity;
 const factor={fat:0.9,muscle:1.05,both:1}[x.goal],cal=Math.round(maintenance*factor/50)*50,protein=Math.round(x.weight*1.6);
 if(cal<1200||!Number.isFinite(cal))return {ok:false,reason:'估算熱量偏低，請使用專業人員確認過的手動目標。'};
 return {ok:true,cal,protein,proteinLow:Math.round(x.weight*1.4),proteinHigh:Math.round(x.weight*2),resting:Math.round(resting),maintenance:Math.round(maintenance),factor,input:{...x}};
}

}

}

function renderBodyPartPlan(legacy){
 const p=db.profile,plan=db.guidedPlan,next=Number.isInteger(plan.nextIndex)&&plan.nextIndex>=0&&plan.nextIndex<plan.days.length?plan.nextIndex:0;
 return `<div class="card"><h2>分部位訓練菜單</h2><p class="accent" role="status">${esc(planMessage)}</p><p>每週 ${p.days} 天 · 健身房 · 每堂集中一個部位</p><p>順序：${plan.days.map(d=>esc(d.title)).join(' → ')} → 循環</p><p class="notice">每週 ${p.days} 天，四堂一輪約 ${Math.round(4/p.days*10)/10} 週。${p.days===2?'例如第一週胸、腿；第二週背、肩與手臂。每個部位不是每週都會輪到。':'請按恢復情況安排訓練日與休息日。'}</p>${p.notes?`<p class="notice">你的動作限制：${esc(p.notes)}<br>尚未自動排除動作；請先編輯不適合的項目，再開始。</p>`:''}<button class="secondary" onclick="tab('profile')">修改個人設定</button><details><summary>訓練方式與參考文獻</summary><p class="muted">每個動作有主要重點，也會有其他肌群協同，不能完全隔離。胸日以不同角度推舉搭配夾胸；下斜推不是訓練下胸的唯一方式，也不保證比平推更好。</p><p class="muted">熱身組另計；每組保留約 2–3 次餘力。第一次重量先設定，器材不熟悉時先請現場教練協助；器材不同的重量不能直接套用。</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/32922646/" target="_blank" rel="noopener">平推與上斜推研究</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/15228624/" target="_blank" rel="noopener">下拉與划船肌肉活動研究</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/2532867/" target="_blank" rel="noopener">腰部伸肌訓練研究</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/38595233/" target="_blank" rel="noopener">分部位與全身訓練回顧</a></p><p class="muted">本菜單的具體動作、組數與排序是 APP 的可調整安排，不是上述研究完整驗證過的同一套課表。肌電活動差異不等於長期增肌量。</p></details></div>
 <div class="card"><h2>${db.activeSession?'進行中：'+esc(db.activeSession.title):'下一堂：'+esc(plan.days[next].title)}</h2><button onclick="${db.activeSession?"tab('workout')":`startPlanDay(${next})`}">${db.activeSession?'繼續這堂訓練':'開始'+esc(plan.days[next].title)+' →'}</button><p class="muted">完成全部設定組數後才會自動輪替；提早結束會保留紀錄與目前順序。也可以從下方自行選部位。</p></div>
 ${plan.days.map((day,d)=>`<details class="card" ${d===next?'open':''}><summary>${esc(day.title)} · ${day.items.length} 個動作${d===next?' · 下一堂':''}</summary>${renderPlanDay(day,d)}</details>`).join('')}${legacy}`;
}

function draw(){let c=$('chart'),ctx=c.getContext('2d'),arr=db.body;if(!arr.length){ctx.fillStyle='#9eacc3';ctx.font='24px sans-serif';ctx.fillText('新增體重後顯示走勢',95,130);return}let vals=arr.map(x=>num(x.weight)),lo=Math.min(...vals)-2,hi=Math.max(...vals)+2;ctx.strokeStyle='#334760';ctx.beginPath();ctx.moveTo(40,20);ctx.lineTo(40,225);ctx.lineTo(580,225);ctx.stroke();ctx.strokeStyle='#61e9d1';ctx.lineWidth=4;ctx.beginPath();arr.forEach((x,i)=>{let px=50+(arr.length===1?0:i/(arr.length-1)*515),py=210-(num(x.weight)-lo)/(hi-lo)*180;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#aebed3';ctx.font='20px sans-serif';ctx.fillText(`${Math.min(...vals)}–${Math.max(...vals)} kg`,55,35)}render();if(!db.profile)tab('profile');
</script></html>
